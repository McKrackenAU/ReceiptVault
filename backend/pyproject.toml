[project]
name = "receiptvault"
version = "1.5.1"
description = "Private self-hosted receipt and invoice evidence locker"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ReceiptVault" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=43.0.0",
  "pyotp>=2.9.0",
  "qrcode>=8.0",
  "httpx>=0.27.0",
  "dramatiq[redis]>=1.17.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.17",
  "python-magic>=0.4.27",
  "pypdf>=5.1.0",
  "pillow>=11.0.0",
  "openpyxl>=3.1.5",
  "reportlab>=4.2.5",
  "nh3>=0.2.18",
  "lxml>=5.3.0",
  "sse-starlette>=2.1.0",
  "structlog>=24.4.0",
  "typer>=0.15.0",
  "orjson>=3.10.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16.0.0"]
browser = ["playwright>=1.49.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "bandit>=1.8.0",
  "httpx>=0.27.0",
]

[project.scripts]
receiptvault = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
